<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Goalbound Chronicle</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-root">
    <!-- Title Screen -->
    <section id="title-screen" class="screen active">
      <div class="title-frame">
        <h1 class="game-title">Goalbound<br>Chronicle</h1>
        <p class="subtitle">ゴールバウンド・クロニクル</p>
        <button id="btn-start" class="btn-primary" type="button">はじめる</button>
        <p class="controls-hint">矢印キー / WASD / タップで移動</p>
      </div>
    </section>

    <!-- Game Screen -->
    <section id="game-screen" class="screen">
      <header id="hud">
        <div class="hud-left">
          <span id="hud-name">冒険者</span>
          <span id="hud-hp">HP: <strong id="hp-val">30</strong>/<strong id="hp-max">30</strong></span>
          <span id="hud-energy">EN: <strong id="en-val">10</strong>/<strong id="en-max">10</strong></span>
        </div>
        <div class="hud-right">
          <span id="hud-area">村</span>
          <span id="hud-items">欠片: <strong id="shard-count">0</strong>/2</span>
        </div>
      </header>

      <div id="map-viewport">
        <canvas id="map-canvas" width="480" height="320"></canvas>
      </div>

      <div id="dialogue-box" class="hidden">
        <p id="dialogue-speaker"></p>
        <p id="dialogue-text"></p>
        <button id="btn-dialogue-next" class="btn-secondary" type="button">▼ つぎ</button>
      </div>

      <div id="battle-panel" class="hidden">
        <div id="battle-enemy">
          <p id="enemy-name"></p>
          <div class="bar bar-enemy"><div id="enemy-hp-bar"></div></div>
          <p id="enemy-hp-text"></p>
        </div>
        <div id="battle-actions">
          <button id="btn-attack" class="btn-battle" type="button">⚔ こうげき</button>
          <button id="btn-defend" class="btn-battle" type="button">🛡 ぼうぎょ</button>
          <button id="btn-special" class="btn-battle" type="button">✨ とくぎ</button>
          <button id="btn-flee" class="btn-battle" type="button">💨 にげる</button>
        </div>
        <p id="battle-log"></p>
      </div>

      <nav id="dpad">
        <button id="btn-up" class="dpad-btn dpad-up" type="button" aria-label="上">▲</button>
        <button id="btn-left" class="dpad-btn dpad-left" type="button" aria-label="左">◀</button>
        <button id="btn-right" class="dpad-btn dpad-right" type="button" aria-label="右">▶</button>
        <button id="btn-down" class="dpad-btn dpad-down" type="button" aria-label="下">▼</button>
        <button id="btn-action" class="dpad-btn dpad-action" type="button" aria-label="調べる">A</button>
      </nav>
    </section>

    <!-- Ending Screen -->
    <section id="ending-screen" class="screen">
      <div class="title-frame">
        <h1 class="game-title ending-title">～ 完 ～</h1>
        <p class="subtitle">Goalbound Chronicle<br>クリアおめでとう！</p>
        <p class="ending-stats" id="ending-stats"></p>
        <button id="btn-restart" class="btn-primary" type="button">もういちど</button>
      </div>
    </section>
  </div>

  <script src="game.js"></script>
</body>
</html>
